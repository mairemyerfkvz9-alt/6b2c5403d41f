version: 2.1

jobs:
  ecn_mark:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set queue
          command: |
            printf 'target 5ms\n' > aqm.cfg
      - run:
          name: Build AQM module
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ecn_mark -j2
      - run:
          name: Mark ECN on congestion
          command: LIONSS_LP=1 ./build/ecn_mark --conf aqm.cfg --codel
  cedar_grove:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Plant layout
          command: |
            printf 'trees = 128\n' > grove.cfg
      - run:
          name: Build growth sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target cedar_grove -j2
      - run:
          name: Grow cedar grove
          command: LIONSS_LP=1 ./build/cedar_grove --config grove.cfg --seasons 4
  navlink-jump:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Place links
          command: |
            printf 'links 20\n' > nav.cfg
      - run:
          name: Build nav system
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target navlink-jump -j2
      - run:
          name: Connect jump links
          command: LIONSS_LP=1 ./build/navlink-jump --conf nav.cfg --max-drop 4
  matterCommission:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set fabric
          command: |
            printf 'fabric 1\n' > matter.cfg
      - run:
          name: Build Matter stack
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target matterCommission -j2
      - run:
          name: Commission device
          command: LIONSS_LP=1 ./build/matterCommission --conf matter.cfg --pin 20202021
  curve_ladder:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write base point
          command: |
            printf '9\n' > base.txt
      - run:
          name: Build montgomery ladder
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target curve_ladder -j2
      - run:
          name: Climb scalar ladder
          command: LIONSS_LP=1 ./build/curve_ladder --base base.txt --bits 255
  sip-invite:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write SIP
          command: |
            printf 'INVITE sip:bob\n' > invite.sip
      - run:
          name: Build SIP stack
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target sip-invite -j2
      - run:
          name: Send INVITE
          command: LIONSS_LP=1 ./build/sip-invite --in invite.sip --transport udp
  verglas:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
